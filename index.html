<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Mestre - Gestão de Cartões</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 20px; }
    h2 { margin-top: 0; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin: 8px 0 16px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; font-size: 0.85rem; }
    a { color: #38bdf8; text-decoration: none; word-break: break-all; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <!-- Tela de Login Mestre -->
  <div id="loginBox" class="card">
    <h2>Acesso Mestre</h2>
    <input type="text" id="masterCpf" placeholder="CPF do Administrador">
    <input type="password" id="masterSenha" placeholder="Senha Mestre">
    <button onclick="loginMestre()">Entrar no Painel</button>
  </div>

  <!-- Dashboard Mestre -->
  <div id="adminPanel" class="card hidden">
    <h2>Painel Administrativo Mestre</h2>
    
    <h3>Cadastrar Novo Cliente</h3>
    <input type="text" id="cliCpfCnpj" placeholder="CPF ou CNPJ do Cliente">
    <input type="text" id="cliNome" placeholder="Nome Completo ou Razão Social">
    <input type="text" id="cliCep" placeholder="CEP">
    <button onclick="cadastrarCliente()">Gerar Cartão & Links</button>

    <h3 style="margin-top: 30px;">Clientes Cadastrados</h3>
    <table>
      <thead>
        <tr>
          <th>Cliente / Documento</th>
          <th>Código</th>
          <th>Link 1 (Edição Cliente)</th>
          <th>Link 2 (Cartão Público)</th>
        </tr>
      </thead>
      <tbody id="clientTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const SUPABASE_URL = 'HTTPS://SEU-PROJETO.SUPABASE.CO';
  const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function loginMestre() {
    const cpf = document.getElementById('masterCpf').value.replace(/\D/g, '');
    const senha = document.getElementById('masterSenha').value;

    if (cpf === '02793444308' && senha === '66493226000180') {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      carregarClientes();
    } else {
      alert('Credenciais Mestre incorretas!');
    }
  }

  async function cadastrarCliente() {
    const cpfCnpj = document.getElementById('cliCpfCnpj').value.replace(/\D/g, '');
    const nome = document.getElementById('cliNome').value;
    const cep = document.getElementById('cliCep').value;
    const codigoUnico = 'CARD-' + Math.random().toString(36).substring(2, 8).toUpperCase();

    if (!cpfCnpj || !nome) return alert('Preencha CPF/CNPJ e Nome.');

    const { error } = await db.from('cartoes').insert([{
      codigo_unico: codigoUnico,
      cpf_cnpj: cpfCnpj,
      nome: nome,
      cep: cep
    }]);

    if (error) {
      alert('Erro ao cadastrar: ' + error.message);
    } else {
      alert('Cliente cadastrado com sucesso!');
      carregarClientes();
    }
  }

  async function carregarClientes() {
    const { data } = await db.from('cartoes').select('*').order('criado_em', { ascending: false });
    const tbody = document.getElementById('clientTableBody');
    tbody.innerHTML = '';

    const baseUrl = window.location.origin;

    data.forEach(c => {
      const linkEditar = `${baseUrl}/editar.html?code=${c.codigo_unico}`;
      const linkPublico = `${baseUrl}/cartao.html?code=${c.codigo_unico}`;
      tbody.innerHTML += `
        <tr>
          <td><b>${c.nome}</b><br><small>${c.cpf_cnpj}</small></td>
          <td><code>${c.codigo_unico}</code></td>
          <td><a href="${linkEditar}" target="_blank">Link 1 (Editar)</a></td>
          <td><a href="${linkPublico}" target="_blank">Link 2 (Ver Cartão)</a></td>
        </tr>
      `;
    });
  }
</script>
</body>
</html>
