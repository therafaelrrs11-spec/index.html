<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preencher Dados do Cartão</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .form-card { width: 100%; max-width: 600px; background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
    label { display: block; margin-top: 15px; color: #94a3b8; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    .btn-save { width: 100%; padding: 15px; background: #22c55e; color: #fff; border: none; border-radius: 10px; font-weight: bold; margin-top: 25px; cursor: pointer; }
    .social-row, .product-row { display: flex; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="form-card">
  <h2>Suplementar Informações do Cartão</h2>
  
  <label>Foto de Perfil</label>
  <input type="file" id="fotoPerfil" accept="image/*">

  <label>Banner de Fundo da Página</label>
  <input type="file" id="bannerFundo" accept="image/*">

  <label>Nome Pessoal ou da Empresa</label>
  <input type="text" id="nome">

  <label>Número do WhatsApp (com DDD)</label>
  <input type="text" id="whatsapp" placeholder="5511999999999">

  <h3>Redes Sociais</h3>
  <div id="socialContainer"></div>
  <button type="button" onclick="addSocial()" style="background:#0284c7; border:none; color:#fff; padding:8px 12px; border-radius:6px; margin-top:10px; cursor:pointer;">+ Adicionar Rede Social</button>

  <h3>Produtos e Serviços (Fotos / Vídeos)</h3>
  <div id="productContainer"></div>
  <button type="button" onclick="addProduct()" style="background:#0284c7; border:none; color:#fff; padding:8px 12px; border-radius:6px; margin-top:10px; cursor:pointer;">+ Adicionar Produto/Serviço</button>

  <button class="btn-save" onclick="salvarTudo()">Salvar e Atualizar Cartão</button>
</div>

<script>
  const SUPABASE_URL = 'https://ebqxskekvnyhqmigwdla.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Ml3YnD-a-5eQx7J_oJ_Sfg_WicgJy-a';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');

  async function carregarDados() {
    if (!code) return alert('Código do cartão inválido!');
    const { data } = await db.from('cartoes').select('*').eq('codigo_unico', code).single();
    if (data) {
      document.getElementById('nome').value = data.nome || '';
      document.getElementById('whatsapp').value = data.whatsapp || '';
      if (data.links_sociais) data.links_sociais.forEach(s => addSocial(s.rede, s.url));
    }
  }

  function addSocial(rede = 'instagram', url = '') {
    const div = document.createElement('div');
    div.className = 'social-row';
    div.innerHTML = `
      <select class="social-rede">
        <option value="instagram">Instagram</option>
        <option value="facebook">Facebook</option>
        <option value="linkedin">LinkedIn</option>
        <option value="tiktok">TikTok</option>
        <option value="youtube">YouTube</option>
        <option value="site">Website</option>
      </select>
      <input type="text" placeholder="URL do Perfil" value="${url}" class="social-url">
    `;
    if(rede) div.querySelector('.social-rede').value = rede;
    document.getElementById('socialContainer').appendChild(div);
  }

  function addProduct() {
    const div = document.createElement('div');
    div.className = 'product-row';
    div.innerHTML = `
      <input type="text" placeholder="Título do Produto/Serviço" class="prod-titulo">
      <input type="file" accept="image/*,video/*" class="prod-arquivo">
    `;
    document.getElementById('productContainer').appendChild(div);
  }

  async function uploadFile(file) {
    if (!file) return null;
    const name = `${code}/${Date.now()}_${file.name}`;
    await db.storage.from('midias').upload(name, file);
    return db.storage.from('midias').getPublicUrl(name).data.publicUrl;
  }

  async function salvarTudo() {
    const fotoFile = document.getElementById('fotoPerfil').files[0];
    const bannerFile = document.getElementById('bannerFundo').files[0];

    const fotoUrl = await uploadFile(fotoFile);
    const bannerUrl = await uploadFile(bannerFile);

    // Links Sociais
    const redes = document.querySelectorAll('.social-rede');
    const urls = document.querySelectorAll('.social-url');
    const linksSociais = [];
    redes.forEach((r, i) => { if (urls[i].value) linksSociais.push({ rede: r.value, url: urls[i].value }); });

    // Produtos
    const prodsTitulos = document.querySelectorAll('.prod-titulo');
    const prodsArquivos = document.querySelectorAll('.prod-arquivo');
    const produtosServicos = [];

    for (let i = 0; i < prodsTitulos.length; i++) {
      if (prodsArquivos[i].files[0]) {
        const fileUrl = await uploadFile(prodsArquivos[i].files[0]);
        const type = prodsArquivos[i].files[0].type.startsWith('video') ? 'video' : 'foto';
        produtosServicos.push({ titulo: prodsTitulos[i].value, url: fileUrl, tipo: type });
      }
    }

    const payload = {
      nome: document.getElementById('nome').value,
      whatsapp: document.getElementById('whatsapp').value,
      links_sociais: linksSociais
    };

    if (fotoUrl) payload.foto_perfil = fotoUrl;
    if (bannerUrl) payload.banner_fundo = bannerUrl;
    if (produtosServicos.length) payload.produtos_servicos = produtosServicos;

    await db.from('cartoes').update(payload).eq('codigo_unico', code);
    alert('Dados salvos! O Cartão Público foi atualizado automaticamente.');
  }

  carregarDados();
</script>
</body>
</html>
