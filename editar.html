<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Cartão Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .form-card { width: 100%; max-width: 600px; background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
    h2, h3 { color: #38bdf8; margin-top: 0; }
    label { display: block; margin-top: 15px; color: #94a3b8; font-size: 0.9rem; font-weight: 600; }
    input, select { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    .btn-save { width: 100%; padding: 15px; background: #22c55e; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; margin-top: 30px; cursor: pointer; }
    .btn-save:hover { background: #16a34a; }
    .btn-add { background: #0284c7; border: none; color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .social-row, .product-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
    .preview-img { max-width: 100px; max-height: 100px; border-radius: 8px; margin-top: 8px; object-fit: cover; display: none; border: 1px solid #38bdf8; }
    .preview-banner { width: 100%; height: 80px; border-radius: 8px; margin-top: 8px; object-fit: cover; display: none; border: 1px solid #38bdf8; }
  </style>
</head>
<body>
<div class="form-card">
  <h2>Suplementar Informações do Cartão</h2>
  
  <label>Foto de Perfil</label>
  <img id="prevFoto" class="preview-img">
  <input type="file" id="fotoPerfil" accept="image/*">

  <label>Banner de Fundo da Página</label>
  <img id="prevBanner" class="preview-banner">
  <input type="file" id="bannerFundo" accept="image/*">

  <label>Nome Pessoal ou da Empresa</label>
  <input type="text" id="nome">

  <label>Número do WhatsApp (com DDD - Ex: 5511999999999)</label>
  <input type="text" id="whatsapp" placeholder="5511999999999">

  <hr style="border-color:#334155; margin: 25px 0;">

  <h3>Redes Sociais</h3>
  <div id="socialContainer"></div>
  <button type="button" class="btn-add" onclick="addSocial()">+ Adicionar Rede Social</button>

  <hr style="border-color:#334155; margin: 25px 0;">

  <h3>Produtos e Serviços (Fotos / Vídeos)</h3>
  <div id="productContainer"></div>
  <button type="button" class="btn-add" onclick="addProduct()">+ Adicionar Produto/Serviço</button>

  <button class="btn-save" onclick="salvarTudo()">Salvar e Atualizar Cartão</button>
</div>

<script>
  // COLOQUE SUAS CHAVES DO SUPABASE AQUI
  const SUPABASE_URL = 'https://ebqxskekvnyhqmigwdla.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Ml3YnD-a-5eQx7J_oJ_Sfg_WicgJy-a';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');

  let currentFotoUrl = null;
  let currentBannerUrl = null;

  async function carregarDados() {
    if (!code) return alert('Código do cartão não encontrado na URL!');
    const { data, error } = await db.from('cartoes').select('*').eq('codigo_unico', code).single();
    if (error) {
      console.error('Erro ao buscar dados:', error);
      return;
    }
    if (data) {
      document.getElementById('nome').value = data.nome || '';
      document.getElementById('whatsapp').value = data.whatsapp || '';
      
      if (data.foto_perfil) {
        currentFotoUrl = data.foto_perfil;
        const prev = document.getElementById('prevFoto');
        prev.src = data.foto_perfil;
        prev.style.display = 'block';
      }
      
      if (data.banner_fundo) {
        currentBannerUrl = data.banner_fundo;
        const prevB = document.getElementById('prevBanner');
        prevB.src = data.banner_fundo;
        prevB.style.display = 'block';
      }

      if (data.links_sociais && data.links_sociais.length > 0) {
        data.links_sociais.forEach(s => addSocial(s.rede, s.url));
      }

      if (data.produtos_servicos && data.produtos_servicos.length > 0) {
        data.produtos_servicos.forEach(p => addProduct(p.titulo, p.url, p.tipo));
      }
    }
  }

  function addSocial(rede = 'instagram', url = '') {
    const div = document.createElement('div');
    div.className = 'social-row';
    div.innerHTML = `
      <select class="social-rede">
        <option value="instagram">Instagram</option>
        <option value="facebook">Facebook</option>
        <option value="linkedin">LinkedIn</option>
        <option value="tiktok">TikTok</option>
        <option value="youtube">YouTube</option>
        <option value="site">Website</option>
      </select>
      <input type="text" placeholder="URL do Perfil" value="${url}" class="social-url">
    `;
    if(rede) div.querySelector('.social-rede').value = rede;
    document.getElementById('socialContainer').appendChild(div);
  }

  function addProduct(titulo = '', urlExistente = '', tipoExistente = '') {
    const div = document.createElement('div');
    div.className = 'product-row';
    div.setAttribute('data-url', urlExistente);
    div.setAttribute('data-tipo', tipoExistente);
    div.innerHTML = `
      <input type="text" placeholder="Título do Produto/Serviço" value="${titulo}" class="prod-titulo">
      <input type="file" accept="image/*,video/*" class="prod-arquivo">
      ${urlExistente ? `<span style="font-size:0.75rem; color:#22c55e;">✔ Arquivo Salvo</span>` : ''}
    `;
    document.getElementById('productContainer').appendChild(div);
  }

  async function uploadFile(file) {
    if (!file) return null;
    const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
    const path = `${code}/${Date.now()}_${cleanName}`;
    const { data, error } = await db.storage.from('midias').upload(path, file, { upsert: true });

    if (error) {
      alert('Erro ao enviar arquivo para o Supabase Storage: ' + error.message);
      console.error(error);
      return null;
    }

    const { data: urlData } = db.storage.from('midias').getPublicUrl(path);
    return urlData.publicUrl;
  }

  async function salvarTudo() {
    const btn = document.querySelector('.btn-save');
    btn.innerText = 'Salvando arquivos e dados...';
    btn.disabled = true;

    try {
      const fotoFile = document.getElementById('fotoPerfil').files[0];
      const bannerFile = document.getElementById('bannerFundo').files[0];

      let fotoUrl = currentFotoUrl;
      let bannerUrl = currentBannerUrl;

      if (fotoFile) {
        const uploaded = await uploadFile(fotoFile);
        if (uploaded) fotoUrl = uploaded;
      }

      if (bannerFile) {
        const uploadedB = await uploadFile(bannerFile);
        if (uploadedB) bannerUrl = uploadedB;
      }

      // Processa Redes Sociais
      const redes = document.querySelectorAll('.social-rede');
      const urls = document.querySelectorAll('.social-url');
      const linksSociais = [];
      redes.forEach((r, i) => { 
        if (urls[i].value.trim()) linksSociais.push({ rede: r.value, url: urls[i].value.trim() }); 
      });

      // Processa Produtos/Serviços
      const prodRows = document.querySelectorAll('.product-row');
      const produtosServicos = [];

      for (const row of prodRows) {
        const titulo = row.querySelector('.prod-titulo').value.trim();
        const fileInput = row.querySelector('.prod-arquivo');
        const file = fileInput.files[0];
        let pUrl = row.getAttribute('data-url') || null;
        let pTipo = row.getAttribute('data-tipo') || 'foto';

        if (file) {
          pUrl = await uploadFile(file);
          pTipo = file.type.startsWith('video') ? 'video' : 'foto';
        }

        if (titulo && pUrl) {
          produtosServicos.push({ titulo, url: pUrl, tipo: pTipo });
        }
      }

      const payload = {
        nome: document.getElementById('nome').value,
        whatsapp: document.getElementById('whatsapp').value,
        foto_perfil: fotoUrl,
        banner_fundo: bannerUrl,
        links_sociais: linksSociais,
        produtos_servicos: produtosServicos
      };

      const { error } = await db.from('cartoes').update(payload).eq('codigo_unico', code);

      if (error) {
        alert('Erro ao salvar no banco de dados: ' + error.message);
      } else {
        alert('Dados salvos com sucesso!');
        location.reload();
      }
    } catch(err) {
      console.error(err);
      alert('Erro inesperado: ' + err.message);
    } finally {
      btn.innerText = 'Salvar e Atualizar Cartão';
      btn.disabled = false;
    }
  }

  carregarDados();
</script>
</body>
</html>
