<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Display", sans-serif; }
    body { background: #000; color: #fff; display: flex; justify-content: center; min-height: 100vh; background-size: cover; background-position: center; }
    .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(25px); z-index: 1; }
    .card-wrapper { position: relative; z-index: 2; width: 100%; max-width: 420px; padding: 20px; text-align: center; }
    
    /* Design Estilo iOS Glassmorphism */
    .avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.3); margin-top: 40px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-top: 12px; }
    
    .ios-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 16px; margin-top: 12px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px; color: #fff; text-decoration: none; font-weight: 600;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); transition: transform 0.2s;
    }
    .ios-btn:active { transform: scale(0.98); }
    .ios-btn-whatsapp { background: #25D366; color: #fff; border: none; }

    .gallery { margin-top: 30px; text-align: left; }
    .gallery-item { background: rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; margin-top: 15px; border: 1px solid rgba(255,255,255,0.1); }
    .gallery-item img, .gallery-item video { width: 100%; display: block; }
    .gallery-item p { padding: 12px; font-size: 0.9rem; font-weight: 500; }
  </style>
</head>
<body>
<div class="backdrop"></div>
<div class="card-wrapper">
  <img id="avatar" class="avatar" src="https://via.placeholder.com/150">
  <h1 id="nome">Carregando...</h1>

  <!-- Botão WhatsApp -->
  <div id="waBox"></div>

  <!-- Botões Redes Sociais iOS -->
  <div id="socialBox"></div>

  <!-- Galeria Produtos e Serviços -->
  <div class="gallery" id="galleryBox"></div>
</div>

<script>
  const SUPABASE_URL = 'HTTPS://SEU-PROJETO.SUPABASE.CO';
  const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const code = new URLSearchParams(window.location.search).get('code');

  async function render() {
    if (!code) return;
    const { data } = await db.from('cartoes').select('*').eq('codigo_unico', code).single();
    if (!data) return;

    if (data.banner_fundo) document.body.style.backgroundImage = `url('${data.banner_fundo}')`;
    if (data.foto_perfil) document.getElementById('avatar').src = data.foto_perfil;
    document.getElementById('nome').innerText = data.nome || '';

    // WhatsApp Action
    if (data.whatsapp) {
      document.getElementById('waBox').innerHTML = `
        <a href="https://wa.me/${data.whatsapp}" target="_blank" class="ios-btn ios-btn-whatsapp">
          💬 Adicionar Contato / WhatsApp
        </a>
      `;
    }

    // Social Links
    const socialBox = document.getElementById('socialBox');
    if (data.links_sociais) {
      data.links_sociais.forEach(s => {
        socialBox.innerHTML += `
          <a href="${s.url}" target="_blank" class="ios-btn">
            🔗 ${s.rede.toUpperCase()}
          </a>
        `;
      });
    }

    // Showcase Products
    const galleryBox = document.getElementById('galleryBox');
    if (data.produtos_servicos) {
      data.produtos_servicos.forEach(p => {
        const mediaTag = p.tipo === 'video' 
          ? `<video src="${p.url}" controls></video>`
          : `<img src="${p.url}">`;
        
        galleryBox.innerHTML += `
          <div class="gallery-item">
            ${mediaTag}
            <p>${p.titulo}</p>
          </div>
        `;
      });
    }
  }

  render();
</script>
</body>
</html>
