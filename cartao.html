<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    
    /* Corpo da página com o Banner de Fundo */
    body {
      background-color: #0f172a;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Máscara de escurecimento/desfoque por cima do banner */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 1;
    }

    /* Cartão Principal */
    .card-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* Estilo da Foto de Perfil */
    .avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- Camada de fundo com desfoque -->
  <div class="overlay"></div>

  <!-- Cartão do Cliente -->
  <div class="card-container">
    <!-- Imagem de Perfil com imagem genérica de fallback -->
    <img id="fotoPerfil" class="avatar-img" src="https://via.placeholder.com/150?text=Perfil" alt="Foto de Perfil">
    
    <h2 id="nomeCliente">Carregando...</h2>
  </div>

  <script>
    // Configuração do Supabase
    const SUPABASE_URL = 'https://ebqxskekvnyhqmigwdla.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Ml3YnD-a-5eQx7J_oJ_Sfg_WicgJy-a';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarCartao() {
      // 1. Pega o código da URL (ex: cartao.html?code=CARD-123456)
      const urlParams = new URLSearchParams(window.location.search);
      const codigo = urlParams.get('code');

      if (!codigo) {
        console.error('Código não encontrado na URL');
        return;
      }

      // 2. Busca os dados no banco de dados Supabase
      const { data, error } = await db
        .from('cartoes')
        .select('foto_perfil, banner_fundo, nome')
        .eq('codigo_unico', codigo)
        .single();

      if (error || !data) {
        console.error('Erro ao buscar cartão:', error);
        return;
      }

      // 3. Aplica a Foto de Perfil no <img>
      if (data.foto_perfil) {
        document.getElementById('fotoPerfil').src = data.foto_perfil;
      }

      // 4. Aplica o Banner como Plano de Fundo do <body>
      if (data.banner_fundo) {
        document.body.style.backgroundImage = `url('${data.banner_fundo}')`;
      }

      // 5. Atualiza o nome
      if (data.nome) {
        document.getElementById('nomeCliente').innerText = data.nome;
      }
    }

    // Executa ao carregar a página
    carregarCartao();
  </script>
</body>
</html>
